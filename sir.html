    <style>

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(white,#82CAFF);
}
.card {
    width: 380px;
    background: white;
    border-radius: 25px;
    overflow: hidden;
    text-align: center;
    box-shadow:0 15px 40px rgba(0, 0, 0, 0.35);
    transition: 0.5s ;
}
.card:hover {
    transform: translateY(-12px);
    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(0, 200, 255, 0.4);
}
.sir-image {
    width: 100%;
    height: 350px;
    overflow: hidden;
    background: #eee;
       border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            border-bottom-left-radius: 5px;
            border-bottom-right-radius: 5px;
            object-fit: cover;
}
.sir-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.6s ease;
    
}
.card:hover .sir-image img {
    transform: scale(1.08);
}
h3 {
    font-size: 26px;
    margin-top: 22px;
    color: #222;
    transition: 0.3s ease;
     font-family: "Moon Dance", cursive;
}
.card:hover h3 {
    color: #0077ff;
    letter-spacing: 1px;
}
.guidance {
    padding: 20px 30px 25px;
}
.guidance p {
    color: #666;
    font-size: 15px;
    line-height: 1.7;
 font-family: "Agbalumo", system-ui;
  font-weight: 400;
}
footer {
    padding: 18px;
    background: linear-gradient(  90deg, #0072ff,  #8e2de2);
    transition: 0.4s ease;
}
footer p {
    color: white;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
}
.card:hover footer {
    padding: 22px;
    letter-spacing: 2px;
}
    </style>
</head>
<body>
    <div class="card">
           <div class="sir-image">
            <img src="2nd_page/sir.png" alt="Sir">
        </div>
           <h3>Mr. Apurba Goswami</h3>
           <div class="guidance">
            <p>
                Thank you Sir for your valuable guidance,
                support and encouragement. Your guidance
                always inspires us to learn, grow and
                achieve our goals.
            </p>
        </div>
       <footer>
            <p>Thank You Sir ❤️</p>
        </footer>

    </div>
</body>
</html>
